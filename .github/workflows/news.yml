name: Update T.S Times news
on:
  schedule:
    - cron: "30 0 * * *"    # 6:00 am IST
    - cron: "30 12 * * *"   # 6:00 pm IST
  workflow_dispatch: {}     # lets you press "Run workflow" by hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_news.py
      - run: python news.py
      - name: Save the new edition
        run: |
          git config user.name "ts-times-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stories.json
          git diff --cached --quiet || git commit -m "Edition $(date -u +%F\ %H:%M)"
          git push
