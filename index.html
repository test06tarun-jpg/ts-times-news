<style>
/* Layout: phone-first shell. Sign-up is a one-question-per-screen wizard; after it, a bottom-tab app. Cards are full-height snap cards with illustrated artwork, ending on a "caught up" card. */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --ink:#15171B; --muted:#5B606A; --line:#DEDCD5; --soft:#ECEAE4;
  --biz:#1E7F5C; --sport:#1F5FA8; --ent:#B5365F; --tech:#5B4BB5; --life:#B54A0A; --pol:#3B4A5A; --edu:#0F7C8A; --sci:#5A7D1F; --red:#C8372D;
  --ok:#17663F; --warn:#8A5A00; --bad:#A22A2A; --okbg:#DDF0E5; --warnbg:#F8EBCB; --badbg:#F6DCDC; --focus:#1F5FA8;
  --f-head:'Playfair Display',Georgia,serif; --f-body:'Source Serif 4',Georgia,serif; --f-ui:'Inter',system-ui,sans-serif; --f-logo:'Space Grotesk',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#181B20; --ink:#F1F0EC; --muted:#A3A8B1; --line:#2B2F36; --soft:#20242A;
  --ok:#7FD6A5; --warn:#F0C569; --bad:#F29B9B; --okbg:#173525; --warnbg:#3A2E10; --badbg:#3E1B1B; --focus:#7DB1F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#181B20; --ink:#F1F0EC; --muted:#A3A8B1; --line:#2B2F36; --soft:#20242A;
  --ok:#7FD6A5; --warn:#F0C569; --bad:#F29B9B; --okbg:#173525; --warnbg:#3A2E10; --badbg:#3E1B1B; --focus:#7DB1F0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-logo);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.6px}
.tile{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:-.8px}
.tile i{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--red);margin-left:.08em}
.soon{font-size:11px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:99px;padding:2px 7px}
.ch[aria-pressed="true"] .soon{background:transparent;color:inherit;opacity:.8}
.pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto}
.pad{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav[hidden]{display:none}
nav button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:500}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"] span{border-bottom:2px solid var(--ink)}
/* cards */
.deck{scroll-snap-type:y proximity}
.card{min-height:100%;scroll-snap-align:start;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex}
.cardin{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;width:100%}
.art{height:200px;position:relative;flex:none;color:#fff;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.art svg.bg{position:absolute;inset:0;width:100%;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 62%)}
.tagrow{position:absolute;z-index:1;left:14px;bottom:12px;right:14px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase}
.tagrow svg{width:18px;height:18px;flex:none}
.credit{position:absolute;z-index:1;right:10px;top:8px;font-size:10px;opacity:.8}
.cbody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.cbody h2{font-family:var(--f-head);font-weight:900;font-size:25px;line-height:1.12;margin:0;text-wrap:balance}
.cbody .sub{font-style:italic;color:var(--muted);font-family:var(--f-body);margin:-4px 0 0}
.cbody p{font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.full p{margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-weight:600;font-size:11.5px}
.chip.multi{background:var(--okbg);color:var(--ok)}.chip.single{background:var(--warnbg);color:var(--warn)}.chip.data{background:var(--soft);color:var(--muted)}
.why{border-left:3px solid var(--c);background:var(--soft);padding:9px 12px;border-radius:0 8px 8px 0;font-family:var(--f-body);font-style:italic;font-size:15.5px}
.why b{display:block;font-family:var(--f-ui);font-style:normal;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.more{margin-top:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.more:hover{background:var(--soft)}
.edu{font-size:12px;color:var(--muted)}
.end{align-items:center;text-align:center}
.end .cardin{padding:36px 24px;align-items:center;gap:14px}
.end h2{font-family:var(--f-head);font-size:28px;margin:0}
.end p{color:var(--muted);margin:0;max-width:34ch}
.tick{width:54px;height:54px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center}
.meta a{color:inherit;text-decoration:underline}
.sug{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 8px}
.quiet{font-size:13px;background:var(--soft);padding:10px 12px;border-radius:10px;width:100%;text-align:left}
/* wizard + forms */
h1{font-family:var(--f-head);font-size:30px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:46ch}
.prog{display:flex;gap:6px;margin-bottom:22px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--ink)}
.stepno{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
label,.lab{font-weight:600;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=email],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;font-size:16px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.ch[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .ch{justify-content:center;border-radius:10px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:14px 18px;font-weight:600;width:100%;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.nav2{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:8px}
.nav2.one{grid-template-columns:1fr}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:16px}
.note.good{background:var(--okbg);color:var(--ok)}.note.bad{background:var(--badbg);color:var(--bad)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:14px;font-weight:400}
.chk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--ink)}
.head{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.head summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:600}
.head summary::-webkit-details-marker{display:none}
.head .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.head .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.head .chev{transition:transform .15s}
.head[open] .chev{transform:rotate(180deg)}
.head .chips{padding:0 14px 14px}
.head .civ{padding:0 14px 12px;font-size:12px;color:var(--muted)}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px}
.sum div+div{margin-top:6px}
.pg{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pg i{font-style:normal;font-family:var(--f-head);font-weight:900;font-size:22px;color:var(--muted)}
.pg b{display:block}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* style A: colour-block cards */
.cardin{position:relative;background:var(--c);border:0;border-radius:28px;color:#fff}
.art{position:static;height:min(36vh,290px);margin-top:52px;background:none;flex:none}
.art::after{display:none}
.art svg.bg{position:relative;inset:auto;width:100%;height:100%;display:block}
.tagrow{left:18px;top:18px;right:auto;bottom:auto;background:#fff;color:var(--c);padding:7px 14px;border-radius:99px;letter-spacing:1.6px;font-size:11.5px}
.tagrow>svg{display:none}
.sug{background:var(--c);color:#fff;border-radius:99px;padding:2px 8px;margin-left:4px;font-size:10px}
.cbody{padding:6px 22px 22px;gap:12px}
.cbody h2{color:#fff;letter-spacing:-.02em}
.h-s{font-size:36px}.h-m{font-size:30px}.h-l{font-size:25px}
.nobody.h-s{font-size:40px}.nobody.h-m{font-size:34px}
.cbody p,.cbody .sub{color:rgba(255,255,255,.92)}
.meta{color:#fff;margin-top:auto}.meta a{color:#fff}
.chip.multi,.chip.single,.chip.data{background:var(--a);color:#15171B}
.why{background:rgba(255,255,255,.14);border-left-color:var(--a);color:#fff}
.why b{color:rgba(255,255,255,.75)}
.more{border-color:rgba(255,255,255,.45);color:#fff}.more:hover{background:rgba(255,255,255,.12)}
.edu{color:rgba(255,255,255,.85)}
</style></head><body>
