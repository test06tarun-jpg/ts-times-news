<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>T.S Times</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&family=UnifrakturCook:wght@700&display=swap">
<link rel="stylesheet" href="style.css"></head><body>

<div id="app">
  <header class="top"><div class="logo"><span class="tile" aria-hidden="true">TS<i></i></span><span>T.S Times</span></div><div class="pos" id="pos" aria-live="polite"></div></header>
  <main>
    <section class="view deck" id="v-cards" aria-label="Cards" hidden></section>
    <section class="view" id="v-paper" aria-label="Paper" hidden></section>
    <section class="view" id="v-profile" aria-label="Profile"></section>
  </main>
  <nav role="tablist" aria-label="Sections" id="nav" hidden>
    <button role="tab" id="t-cards" aria-selected="true" data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6"/></svg><span>Cards</span></button>
    <button role="tab" id="t-paper" aria-selected="false" data-v="paper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Paper</span></button>
    <button role="tab" id="t-profile" aria-selected="false" data-v="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Profile</span></button>
  </nav>
</div>

<script src="app1.js"></script><script src="app2.js"></script><script src="app3.js"></script><script src="app4.js"></script><script src="app5.js"></script><script src="app6.js"></script></body></html>
