<style>
/* Layout: phone-first shell. Sign-up is a one-question-per-screen wizard; after it, a bottom-tab app. Cards are full-height snap cards with illustrated artwork, ending on a "caught up" card. */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --ink:#15171B; --muted:#5B606A; --line:#DEDCD5; --soft:#ECEAE4;
  --biz:#1E7F5C; --sport:#1F5FA8; --ent:#B5365F; --tech:#5B4BB5; --life:#97660F; --pol:#3B4A5A; --edu:#0F7C8A; --sci:#5A7D1F; --red:#C8372D;
  --ok:#17663F; --warn:#8A5A00; --bad:#A22A2A; --okbg:#DDF0E5; --warnbg:#F8EBCB; --badbg:#F6DCDC; --focus:#1F5FA8;
  --f-head:'Playfair Display',Georgia,serif; --f-body:'Source Serif 4',Georgia,serif; --f-ui:'Inter',system-ui,sans-serif; --f-logo:'Space Grotesk',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#181B20; --ink:#F1F0EC; --muted:#A3A8B1; --line:#2B2F36; --soft:#20242A;
  --ok:#7FD6A5; --warn:#F0C569; --bad:#F29B9B; --okbg:#173525; --warnbg:#3A2E10; --badbg:#3E1B1B; --focus:#7DB1F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#181B20; --ink:#F1F0EC; --muted:#A3A8B1; --line:#2B2F36; --soft:#20242A;
  --ok:#7FD6A5; --warn:#F0C569; --bad:#F29B9B; --okbg:#173525; --warnbg:#3A2E10; --badbg:#3E1B1B; --focus:#7DB1F0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-logo);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.6px}
.tile{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:-.8px}
.tile i{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--red);margin-left:.08em}
.soon{font-size:11px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:99px;padding:2px 7px}
.ch[aria-pressed="true"] .soon{background:transparent;color:inherit;opacity:.8}
.pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto}
.pad{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav[hidden]{display:none}
nav button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:500}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"] span{border-bottom:2px solid var(--ink)}
/* cards */
.deck{scroll-snap-type:y proximity}
.card{min-height:100%;scroll-snap-align:start;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex}
.cardin{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;width:100%}
.art{height:200px;position:relative;flex:none;color:#fff;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.art svg.bg{position:absolute;inset:0;width:100%;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 62%)}
.tagrow{position:absolute;z-index:1;left:14px;bottom:12px;right:14px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase}
.tagrow svg{width:18px;height:18px;flex:none}
.credit{position:absolute;z-index:1;right:10px;top:8px;font-size:10px;opacity:.8}
.cbody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.cbody h2{font-family:var(--f-head);font-weight:900;font-size:25px;line-height:1.12;margin:0;text-wrap:balance}
.cbody .sub{font-style:italic;color:var(--muted);font-family:var(--f-body);margin:-4px 0 0}
.cbody p{font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.full p{margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-weight:600;font-size:11.5px}
.chip.multi{background:var(--okbg);color:var(--ok)}.chip.single{background:var(--warnbg);color:var(--warn)}.chip.data{background:var(--soft);color:var(--muted)}
.why{border-left:3px solid var(--c);background:var(--soft);padding:9px 12px;border-radius:0 8px 8px 0;font-family:var(--f-body);font-style:italic;font-size:15.5px}
.why b{display:block;font-family:var(--f-ui);font-style:normal;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.more{margin-top:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.more:hover{background:var(--soft)}
.edu{font-size:12px;color:var(--muted)}
.end{align-items:center;text-align:center}
.end .cardin{padding:36px 24px;align-items:center;gap:14px}
.end h2{font-family:var(--f-head);font-size:28px;margin:0}
.end p{color:var(--muted);margin:0;max-width:34ch}
.tick{width:54px;height:54px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center}
.meta a{color:inherit;text-decoration:underline}
.sug{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 8px}
.quiet{font-size:13px;background:var(--soft);padding:10px 12px;border-radius:10px;width:100%;text-align:left}
/* wizard + forms */
h1{font-family:var(--f-head);font-size:30px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:46ch}
.prog{display:flex;gap:6px;margin-bottom:22px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--ink)}
.stepno{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
label,.lab{font-weight:600;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=email],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;font-size:16px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.ch[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .ch{justify-content:center;border-radius:10px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:14px 18px;font-weight:600;width:100%;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.nav2{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:8px}
.nav2.one{grid-template-columns:1fr}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:16px}
.note.good{background:var(--okbg);color:var(--ok)}.note.bad{background:var(--badbg);color:var(--bad)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:14px;font-weight:400}
.chk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--ink)}
.head{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.head summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:600}
.head summary::-webkit-details-marker{display:none}
.head .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.head .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.head .chev{transition:transform .15s}
.head[open] .chev{transform:rotate(180deg)}
.head .chips{padding:0 14px 14px}
.head .civ{padding:0 14px 12px;font-size:12px;color:var(--muted)}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px}
.sum div+div{margin-top:6px}
.pg{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pg i{font-style:normal;font-family:var(--f-head);font-weight:900;font-size:22px;color:var(--muted)}
.pg b{display:block}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>

function renderCards(){

  h+=sug.map((x,i)=>cardHtml(x,list.length+1+i,true)).join('');
  v.innerHTML=h; v.scrollTop=0;
  v.querySelectorAll('.more').forEach(b=>b.onclick=()=>{const f=b.parentElement.querySelector('.full');const o=f.hidden;f.hidden=!o;b.setAttribute('aria-expanded',String(o));b.firstElementChild.textContent=o?'Show less':'More detail'});
  watchPos(list.length,sug.length);
}
let io=null;
function watchPos(n,m){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.5){const i=+e.target.dataset.i;$('#pos').textContent=i<n?(i+1)+' of '+n:i===n?'All caught up':'Suggested '+(i-n)+' of '+m}})},{root:$('#v-cards'),threshold:[.5]});
  $('#v-cards').querySelectorAll('.card').forEach(c=>io.observe(c));
  $('#pos').textContent=n?'1 of '+n:'';
}

/* ---- paper ---- */
function renderPaper(){
  const n=+profile.pages||3, sel=profile.topics.map(t=>SUB[t].name);
  const rows=[['1','Front page','Stocks, markets and IPOs'],['2','Entertainment','Movies and OTT'],['3','Sport','Scorecard, football and NBA']].slice(0,n);
  $('#v-paper').innerHTML='<div class="pad"><h1>'+esc(profile.name)+'’s edition</h1><p class="lede">'+esc(EDITION.date)+'. '+n+' pages in '+(profile.style==='plain'?'plain black and white':'colour')+', for '+esc(profile.name)+'.</p>'+
   '<div class="sum"><b>Topics</b>: '+esc(sel.join(', '))+'</div>'+rows.map(r=>'<div class="pg"><i>'+r[0]+'</i><div><b>'+esc(r[1])+'</b><span class="hint">'+esc(r[2])+'</span></div></div>').join('')+
   '<p class="hint" style="margin-top:16px">The personal PDF edition is not connected yet in this test. Your cards are updated twice a day.</p></div>';
}

/* ---- sign-up wizard ---- */
const STEPS=['Your name','Your age','Your privacy','Your interests','Final touches'];
let wiz=null;
function newWiz(){return Object.assign({step:0,name:'',age:'',email:'',consent:false,guardian:false,topics:[],other:'',avoid:'',pages:3,style:'colour',err:''},profile?{...profile,consent:true,guardian:!!profile.guardian,step:0,err:''}:{})}
function renderWizard(){
  if(!wiz)wiz=newWiz(); const w=wiz, minor=isMinor(w.age);
  const prog='<div class="prog" aria-hidden="true">'+STEPS.map((_,i)=>'<i class="'+(i<=w.step?'on':'')+'"></i>').join('')+'</div><div class="stepno">Step '+(w.step+1)+' of '+STEPS.length+'</div>';
  let b='';
  if(w.step===0)b='<h1>Welcome. What should we call you?</h1><p class="lede">We build your edition around you.</p><div class="fld"><label for="name">Name</label><input type="text" id="name" autocomplete="given-name" maxlength="40" value="'+esc(w.name)+'"></div>';
  if(w.step===1)b='<h1>How old are you?</h1><p class="lede">Readers under 18 get a safer set of topics and learning notes on money stories.</p><div class="fld"><label for="age">Age</label><input type="number" id="age" inputmode="numeric" min="8" max="100" value="'+esc(w.age)+'"></div>';
  if(w.step===2)b='<h1>Your privacy</h1><p class="lede">This is a test version. Here is exactly what happens to your details.</p><div class="sum"><div><b>Stays on your phone</b>: your name, age and interests are saved only on this device.</div><div><b>Not collected</b>: we do not ask for your email, and your details are never sent anywhere.</div><div><b>Your control</b>: you can change or delete everything from the Profile tab at any time.</div></div><p class="hint">Stories come from public news feeds. We do not track what you read.</p>';
  if(w.step===3)b='<h1>What do you like to read?</h1><p class="lede">Open a heading and tick what interests you. Pick at least one.</p>'+HEADS.map(h=>{const n=h.subs.filter(s=>w.topics.includes(s.id)).length;
    return '<details class="head" style="--c:'+h.c+'"'+(n||h.id==='biz'?' open':'')+'><summary><span class="dot"></span>'+esc(h.name)+'<span class="cnt">'+(n?n+' selected':'')+'</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></summary>'+
    (h.civ&&minor?'<div class="civ">For readers under 18 this covers civics and policy only. No crime, violence or divisive stories.</div>':'')+
    '<div class="chips" data-h="'+h.id+'">'+h.subs.map(s=>'<button type="button" class="ch" data-t="'+s.id+'" aria-pressed="'+w.topics.includes(s.id)+'">'+esc(s.name)+(s.wip?'<span class="soon">in progress</span>':'')+'</button>').join('')+(h.subs.some(s=>s.wip)?'<p class="hint">In progress: we are still finding reliable sources. Tick them anyway and we will add them as they go live.</p>':'')+'</div></details>'}).join('');
  if(w.step===4)b='<h1>Anything else?</h1><p class="lede">All optional. We match what you type to a section we already cover, and add new ones once we find reliable sources.</p>'+
    '<div class="fld"><label for="other">Something you want to read about</label><textarea id="other" maxlength="120" placeholder="Up to two topics, for example F1 or chess">'+esc(w.other)+'</textarea></div>'+
    '<div class="fld"><label for="avoid">Anything you do not want to see?</label><input type="text" id="avoid" maxlength="80" value="'+esc(w.avoid)+'"></div>'+
    '<div class="fld"><span class="lab">Paper length</span><div class="seg" id="len"><button type="button" class="ch" data-n="2" aria-pressed="'+(+w.pages===2)+'">2 pages</button><button type="button" class="ch" data-n="3" aria-pressed="'+(+w.pages===3)+'">3 pages</button></div></div>'+
    '<div class="fld"><span class="lab">Style</span><div class="seg" id="sty"><button type="button" class="ch" data-s="colour" aria-pressed="'+(w.style!=='plain')+'">Colour</button><button type="button" class="ch" data-s="plain" aria-pressed="'+(w.style==='plain')+'">Plain</button></div></div>';
  const last=w.step===STEPS.length-1;
  $('#v-profile').innerHTML='<form class="pad" id="form" novalidate>'+prog+b+(w.err?'<div class="note bad" role="alert">'+esc(w.err)+'</div>':'')+
   '<div class="nav2'+(w.step===0&&!profile?' one':'')+'">'+(w.step>0||profile?'<button type="button" class="btn ghost" id="back">'+(w.step>0?'Back':'Cancel')+'</button>':'')+'<button class="btn" type="submit">'+(last?(profile?'Save changes':'Build my edition'):'Continue')+'</button></div></form>';
  bindWizard();
}
function bindWizard(){
  const w=wiz, on=(id,ev,f)=>{const e=$(id);if(e)e[ev]=f};
  on('#name','oninput',e=>w.name=e.target.value); on('#age','oninput',e=>w.age=e.target.value); on('#email','oninput',e=>w.email=e.target.value);
  on('#consent','onchange',e=>w.consent=e.target.checked); on('#guardian','onchange',e=>w.guardian=e.target.checked);
  on('#other','oninput',e=>w.other=e.target.value); on('#avoid','oninput',e=>w.avoid=e.target.value);
  on('#len','onclick',e=>{const b=e.target.closest('button');if(!b)return;w.pages=+b.dataset.n;[...$('#len').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  on('#sty','onclick',e=>{const b=e.target.closest('button');if(!b)return;w.style=b.dataset.s;[...$('#sty').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  document.querySelectorAll('.head .chips').forEach(c=>c.onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.t,i=w.topics.indexOf(id);if(i<0)w.topics.push(id);else w.topics.splice(i,1);b.setAttribute('aria-pressed',String(i<0));
    const h=HEADS.find(x=>x.id===c.dataset.h),n=h.subs.filter(s=>w.topics.includes(s.id)).length;c.closest('.head').querySelector('.cnt').textContent=n?n+' selected':''});
  on('#back','onclick',()=>{if(w.step>0){w.step--;w.err='';renderWizard()}else{wiz=null;route()}});
  on('#form','onsubmit',next);
  const f=$('#name,#age,#email'); if(f&&!f.value)f.focus();
}
async function next(e){
  e.preventDefault(); const w=wiz; w.err='';
  if(w.step===0&&!w.name.trim())w.err='Add your name so we can address your edition.';
  else if(w.step===1&&!(+w.age>=8&&+w.age<=100))w.err='Enter an age between 8 and 100.';
  else if(w.step===3&&!w.topics.length)w.err='Pick at least one interest to continue.';
  if(w.err){renderWizard();return}
  if(w.step<STEPS.length-1){w.step++;renderWizard();$('#v-profile').scrollTop=0;return}
  await finish();
}
async function finish(){
  const w=wiz, age=+w.age, minor=age<18; let topics=[...w.topics];
  const items=w.other.split(/[,;\n]| and /i).map(s=>s.trim()).filter(Boolean).slice(0,2);
  const blocked=[],pending=[],matched=[];
  items.forEach(it=>{
    if(minor&&BLOCK.test(it)){blocked.push(it);return}
    const m=matchTopics(it); if(m.length){m.forEach(id=>{if(!topics.includes(id)){topics.push(id);matched.push(SUB[id].name)}})}else pending.push(it)});
  const p={name:w.name.trim(),age,email:w.email.trim(),guardian:minor&&w.guardian,topics,other:items.join(', '),pending,avoid:w.avoid.trim(),pages:w.pages,style:w.style,savedAt:Date.now()};
  await saveEverywhere(p); wiz=null;
  const bits=[]; if(blocked.length)bits.push('We skipped "'+blocked.join('", "')+'" because it is not available for readers under 18.');
  if(pending.length)bits.push('We noted "'+pending.join('", "')+'" and will add it once we find reliable sources.');
  if(matched.length)bits.push('Matched your request to '+matched.join(', ')+'.');
  if(signupMsg)bits.push(signupMsg);
  tab='cards'; route();
  if(bits.length){const d=document.createElement('div');d.className='pad';d.innerHTML='<div class="note good" style="margin:0">'+bits.map(esc).join(' ')+'</div>';$('#v-cards').prepend(d)}
}

/* ---- profile tab ---- */
function renderProfile(){
  const p=profile, names=p.topics.map(t=>SUB[t].name);
  $('#v-profile').innerHTML='<div class="pad"><h1>Your profile</h1><p class="lede">Check or change your details any time.</p>'+
   '<div class="sum"><div><b>Name</b>: '+esc(p.name)+'</div><div><b>Age</b>: '+esc(p.age)+'</div><div><b>Interests</b>: '+esc(names.join(', '))+'</div>'+
   (p.pending&&p.pending.length?'<div><b>Requested</b>: '+esc(p.pending.join(', '))+' (waiting for reliable sources)</div>':'')+(p.avoid?'<div><b>Hidden</b>: '+esc(p.avoid)+'</div>':'')+
   '<div><b>Paper</b>: '+p.pages+' pages, '+esc(p.style)+'</div></div>'+
   (signupMsg?'<div class="note">'+esc(signupMsg)+'</div>':'')+
   '<div class="nav2 one" style="gap:10px"><button class="btn" id="edit">Edit my details</button><button class="btn danger" id="del">Delete my data</button></div>'+
   '<p class="hint" style="margin-top:12px">Deleting removes your profile from this device. Nothing is stored anywhere else.</p></div>';
  $('#edit').onclick=()=>{wiz=newWiz();renderWizard()};
  $('#del').onclick=function(){if(this.dataset.sure){wipe()}else{this.dataset.sure=1;this.textContent='Tap again to delete everything'}};
}

/* ---- shell ---- */
function route(){
  const onboarding=!profile||wiz;
  $('#nav').hidden=!!onboarding;
  ['cards','paper','profile'].forEach(k=>{$('#v-'+k).hidden=onboarding?k!=='profile':k!==tab;$('#t-'+k).setAttribute('aria-selected',String(k===tab))});
  if(onboarding){$('#pos').textContent='';renderWizard();return}
  if(tab==='cards')renderCards(); else{$('#pos').textContent='';tab==='paper'?renderPaper():renderProfile()}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.v;route()});
profile=lsGet(); route(); initDb(); loadLive();
</script>
</body></html>
